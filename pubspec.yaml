name: priorix
description: "Priorix — Eisenhower matrix with time-aware local alerts."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  uuid: ^4.5.1
  intl: ^0.20.2
  flutter_local_notifications: ^19.5.0
  file_picker: ^10.3.7
  path_provider: ^2.1.5
  timezone: ^0.10.1
  flutter_timezone: ^4.0.1
  audioplayers: ^6.8.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  # Preview copies of the alert sounds; the copies notifications actually play
  # live in android/app/src/main/res/raw/ and ios|macos/Runner/.
  assets:
    - assets/sounds/

# Brand PNGs are rendered from lib/core/widgets/priorix_mark.dart by
# test/brand_assets_test.dart (run with --update-goldens).
# Regenerate with:
#   dart run flutter_launcher_icons
#   dart run flutter_native_splash:create
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#0E0F14"
  adaptive_icon_foreground: assets/brand/icon_foreground.png
  min_sdk_android: 21
  macos:
    generate: true
    image_path: assets/brand/icon.png

flutter_native_splash:
  color: "#08090E"
  image: assets/brand/splash_logo.png
  android_12:
    color: "#08090E"
    image: assets/brand/splash_android12.png
  ios_content_mode: center
  web: false
